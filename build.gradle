plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'idea'
}

version = mod_version
group = maven_group

base {
    archivesName = archives_base_name
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version)
    }
}

repositories {
    // Local maven for any manually-installed artifacts
    mavenLocal()

    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }

    maven {
        // Create, Registrate, and Flywheel (Forge 1.20.1)
        name = 'ModMaven'
        url = 'https://modmaven.dev'
    }

    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }

    maven {
        name = 'Create'
        url = 'https://maven.createmod.net'
    }

    mavenCentral()
}

minecraft {
    mappings channel: mappings_channel, version: mappings_version

    runs {
        client {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                creategears {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                creategears {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            args '--mod', 'creategears', '--all', '--output', file('src/generated/resources').getAbsolutePath(), '--existing', file('src/main/resources').getAbsolutePath()

            mods {
                creategears {
                    source sourceSets.main
                }
            }
        }
    }
}

configurations {
    // Runtime-only library dependencies get bundled (shaded) into the jar.
    runtimeLibrary
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Create (Forge 1.20.1). Use the :slim artifact with transitive=false: Create's published
    // artifact is a classifier'd slim jar whose POM is an aggregator (packaging=pom) listing
    // registrate/flywheel/jei/curios/cc-tweaked as runtime deps. ForgeGradle 6 tries to deobf-map
    // each of those too (breaking on unresolvable cc.tweaked etc.); transitive=false cuts that off.
    // This matches Create's official wiki and Create addons (see Create-Delight-Core).
    implementation(fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false })

    // Registrate (Create's registration library). The source imports com.tterrag.registrate.*
    // directly, so it must be on the compile classpath (transitive=false does not provide it).
    implementation fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}")

    // Flywheel (Create's rendering engine). 0.5.1 uses Flywheel 0.6.x (com.jozufozu).
    compileOnly fg.deobf("com.jozufozu.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")
    runtimeOnly fg.deobf("com.jozufozu.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")
}

// Copy resources generated by data generators into the main source set
sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

/* ---- Jar packaging ---- */
processResources {
    var replaceProperties = [
            'mod_version'    : mod_version,
            'minecraft_version': minecraft_version,
            'forge_version'  : forge_version,
            'create_version' : create_version,
            'mod_id'         : 'creategears',
            'mod_name'       : 'Create Gears',
            'mod_authors'    : 'Ra1T0r',
            'description'    : 'Shaftless gears for Create! A port of Create: Gears n\' Kinetics to Create 0.5.1 / Forge 1.20.1.'
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'  : 'creategears',
                'Specification-Vendor' : 'Ra1T0r',
                'Specification-Version': '1',
                'Implementation-Title' : project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'Ra1T0r'
        ])
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
