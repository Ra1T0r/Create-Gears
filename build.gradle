plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '1.0.23'
    id 'idea'
}

version = mod_version
group = maven_group

base {
    archivesName = archives_base_name
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version)
    }
}

repositories {
    // Local maven for any manually-installed artifacts
    mavenLocal()

    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }

    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }

    maven {
        // Flywheel, Create, Ponder (maven.createmod.net)
        name = 'Create'
        url = 'https://maven.createmod.net'
    }

    maven {
        // Create and Ponder on a secondary mirror
        name = 'ModMaven'
        url = 'https://modmaven.dev'
    }

    maven {
        // Registrate (and assorted Create libs)
        name = 'Ithundxr'
        url = 'https://maven.ithundxr.dev/mirror'
    }

    maven {
        name = 'IthundxrSnapshots'
        url = 'https://maven.ithundxr.dev/snapshots'
    }

    maven {
        name = 'JitPack'
        url = 'https://jitpack.io'
    }

    mavenCentral()
}

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
        }

        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.group
        }

        data {
            data()
            programArguments.addAll '--mod', 'creategears', '--all', '--output', file('src/generated/resources').getAbsolutePath(), '--existing', file('src/main/resources').getAbsolutePath()
        }
    }

    mods {
        creategears {
            sourceSet sourceSets.main
        }
    }
}

configurations {
    // Runtime-only library dependencies get bundled (shaded) into the jar.
    runtimeLibrary
}

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version}"

    // Create (NeoForge, slim). We keep most of Create's transitive deps (notably its
    // bundled libraries like catnip), but exclude the runtime-only companion mods whose
    // artifacts we don't want pulled in (they were previously unresolvable at datagen).
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
        exclude group: "dev.ftb.mods"
        exclude group: "maven.modrinth"
        exclude group: "dev.architectury"
    }

    // Registrate (Create's registration library, standalone on NeoForge)
    implementation "com.tterrag.registrate:Registrate:${registrate_version}"

    // Ponder is a hard dependency of Create's kinetic block entities (VirtualBlockEntity,
    // catnip utilities). We keep the library but deliberately do NOT register any Ponder
    // scenes/stories for our own blocks, so the W "behind the scenes" tutorials are gone.
    implementation "net.createmod.ponder:Ponder-NeoForge-${minecraft_version}:${ponder_version}"

    // Flywheel (Create's rendering engine) - compile against the API, bundle the full lib at runtime
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
}

// Copy resources generated by data generators into the main source set
sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

/* ---- Jar packaging ---- */
processResources {
    var replaceProperties = [
            'mod_version'    : mod_version,
            'minecraft_version': minecraft_version,
            'neoforge_version': neoforge_version,
            'create_version' : create_version,
            'mod_id'         : 'creategears',
            'mod_name'       : 'Create Gears',
            'mod_authors'    : 'Ra1T0r',
            'description'    : 'Shaftless gears for Create! A port of Create: Gears n\' Kinetics to Create 6 / NeoForge 1.21.1.'
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'  : 'creategears',
                'Specification-Vendor' : 'Ra1T0r',
                'Specification-Version': '1',
                'Implementation-Title' : project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'Ra1T0r'
        ])
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
